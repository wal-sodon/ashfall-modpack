// Shared configuration for every Ashfall mod module. Applied from modules/*/build.gradle.

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter { includeGroup 'maven.modrinth' }
	}
	maven {
		name = 'Open Parties and Claims'
		url = 'https://chocolateminecraft.com/maven'
		content { includeGroup 'xaero.pac' }
	}
	maven {
		name = 'Fuzs Mod Resources'
		url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven'
		content { includeGroup 'fuzs.forgeconfigapiport' }
	}
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
		content { includeGroup 'me.shedaniel.cloth' }
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "${project.mod_id}_test"
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

base {
	archivesName = "ashfall-${project.name}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_ashfall" }
	}
}
