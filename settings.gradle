pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'ashfall'

// One Gradle build, three mod jars. Dependency direction: arms -> director -> salvage.
include 'salvage', 'director', 'arms'
project(':salvage').projectDir = file('modules/salvage')
project(':director').projectDir = file('modules/director')
project(':arms').projectDir = file('modules/arms')
