name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build
      # One gametest task at a time, as CLAUDE.md asks.
      - name: Gametests (salvage)
        run: ./gradlew :salvage:runGameTest
      - name: Gametests (director)
        run: ./gradlew :director:runGameTest
      - name: Gametests (arms)
        run: ./gradlew :arms:runGameTest
      - name: Check pack pins
        run: python3 -I tools/build_mrpack.py --check-only
