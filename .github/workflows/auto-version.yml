name: Auto version

# Semantic versioning with one pull request per change. When a PR is merged into main, the bot commits the version
# bump straight to main, tags it vX.Y.Z, and the tag push starts release.yml. Label the PR `major` or `minor`
# (otherwise patch), or `no-release` to skip it. The bot never merges or approves anything.
#
# Pushing to the protected main branch and starting release.yml from the tag both need the repository secret
# RELEASE_TOKEN: a personal access token of a repository admin (main's protection does not apply to admins) with
# Contents read/write. A push made with the built-in GITHUB_TOKEN would be refused by the protection and would
# start no other workflow.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      kind:
        description: Bump for changes already on main
        type: choice
        options: [patch, minor, major]
        default: patch
      summary:
        description: Release notes line
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: auto-version
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.merged
          && !contains(github.event.pull_request.labels.*.name, 'no-release'))
    runs-on: ubuntu-latest
    steps:
      - name: Check the token is set
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::The repository secret RELEASE_TOKEN is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Bump, commit to main and tag
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
          INPUT_KIND: ${{ inputs.kind }}
          INPUT_SUMMARY: ${{ inputs.summary }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            kind="$INPUT_KIND"
            summary="$(printf '%s' "$INPUT_SUMMARY" | tr '|' '/')"
          else
            case " $LABELS " in
              *" major "*) kind=major ;;
              *" minor "*) kind=minor ;;
              *)           kind=patch ;;
            esac
            summary="$(printf '%s' "$TITLE" | tr '|' '/') (#$NUMBER)"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Another PR can land on main while this runs; start again from the new main if the push is refused.
          for attempt in 1 2 3; do
            git fetch -q origin main --tags
            git reset -q --hard origin/main
            base="$(sed -n 's/^version=//p' gradle.properties)"
            IFS=. read -r a b c <<< "$base"
            case "$kind" in
              major) new="$((a + 1)).0.0" ;;
              minor) new="$a.$((b + 1)).0" ;;
              *)     new="$a.$b.$((c + 1))" ;;
            esac
            if git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
              echo "::error::Tag v$new already exists but main says $base. Delete the stray tag or fix the version by hand."
              exit 1
            fi

            sed -i "s/^version=.*/version=$new/" gradle.properties
            sed -i "s/Written for Ashfall [0-9.]*,/Written for Ashfall $new,/" docs/wiki/ashfall-wiki.html
            awk -v row="| $new | $kind | $summary |" '
              { print }
              /^## Releases/ { sec = 1 }
              sec && /^\|---/ { print row; sec = 0 }
            ' docs/versions.md > versions.tmp && mv versions.tmp docs/versions.md
            git commit -qam "Release v$new ($kind): $summary"

            if git push origin HEAD:main; then
              git tag "v$new"
              # The tag is pushed with RELEASE_TOKEN, so it starts release.yml (build, pack, GitHub release).
              git push origin "v$new"
              echo "Released v$new ($kind): $summary" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::Push to main refused (attempt $attempt); retrying from the latest main."
            sleep 5
          done
          echo "::error::Could not push the version bump to main. If main moved, run this workflow again by hand. If the push was refused as a protected branch, RELEASE_TOKEN must belong to a repository admin and have Contents write access."
          exit 1
